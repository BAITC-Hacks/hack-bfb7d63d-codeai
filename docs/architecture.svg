  <path d="M780 689H836" class="optional-line"/>

  <rect x="846" y="648" width="372" height="80" rx="11" fill="#F4F7FB"/>
  <text x="863" y="678" font-size="18" font-weight="650" fill="#142D44">Жауапты тексеру → кэш</text>
  <text x="863" y="706" class="small">Факт сілтемелері · жергілікті сандар</text>
  <circle cx="70" cy="755" r="4" fill="#136F83"/>
  <text x="84" y="760" font-size="15" font-weight="600" fill="#136F83">Кілтсіз режим: фактілер → жергілікті TXT / JSON есеп · API шақырылмайды</text>

  <text x="40" y="812" font-size="14" fill="#527083">Бақыланған байланыс ≠ дәл сол қаражаттың жолы. Рөл ≠ кінәлілік.</text>
  <text x="1240" y="812" text-anchor="end" font-size="14" font-weight="600" fill="#527083">MoneyMap / HackAlem AI</text>
</svg>
