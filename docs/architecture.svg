  <rect x="324" y="148" width="242" height="230" rx="16" fill="#FFFFFF" stroke="#D3DFE8"/>
  <rect x="324" y="148" width="242" height="5" rx="2.5" fill="#136F83"/>
  <circle cx="352" cy="185" r="15" fill="#E0F2F2"/>
