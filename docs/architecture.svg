  <rect x="608" y="148" width="274" height="230" rx="16" fill="#FFFFFF" stroke="#D3DFE8"/>
  <rect x="608" y="148" width="274" height="5" rx="2.5" fill="#136F83"/>
  <circle cx="636" cy="185" r="15" fill="#E0F2F2"/>
