<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title description">
  <title id="title">MoneyMap жүйесінің архитектурасы</title>
  <desc id="description">Үш Parquet файлы жергілікті тексеруден өтеді. NetworkX бағытталған граф пен көрсеткіштерді есептейді. Рөл ережелері, Louvain кластерлері және тәуелсіз басымдық Streamlit картасына және ТЗ талап еткен үш CSV файлына беріледі. Қосымша AI тармағы тек таңдалған фактілер мен уақытша клиент белгілерін пайдаланады. Қазіргі кілтсіз режимде жергілікті есеп дайындалады, нақты API тексерілген жоқ.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#287B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="optional-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#648693" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 650; fill: #142D44; }
      .body { font-size: 17px; fill: #344F63; }
      .small { font-size: 14px; fill: #527083; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 16px; fill: #23475F; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #477284; }
      .line { fill: none; stroke: #287B87; stroke-width: 2.5; marker-end: url(#arrow); }
      .optional-line { fill: none; stroke: #648693; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#optional-arrow); }
    </style>
  </defs>
  <rect width="1280" height="840" fill="#F4F7FB"/>
  <rect width="1280" height="99" fill="#10283F"/>
  <rect x="40" y="28" width="5" height="45" rx="2.5" fill="#52D8C4"/>
  <text x="61" y="49" font-size="31" font-weight="700" fill="#FFFFFF">MoneyMap · жүйе архитектурасы</text>
  <text x="61" y="78" font-size="16" fill="#BDD0DF">Бақыланған аударымдар → түсіндірілетін талдау → тексеруге арналған нәтиже</text>
  <rect x="986" y="28" width="254" height="42" rx="21" fill="#1E5864"/>
  <circle cx="1010" cy="49" r="5" fill="#52D8C4"/>
  <text x="1026" y="55" font-size="16" font-weight="600" fill="#EAFBFA">Жергілікті аналитика</text>

  <text x="40" y="127" class="eyebrow">НЕГІЗГІ ЕСЕПТЕУ · PYTHON / PANDAS / NETWORKX</text>

  <rect x="40" y="148" width="242" height="230" rx="16" fill="#FFFFFF" stroke="#D3DFE8"/>
  <rect x="40" y="148" width="242" height="5" rx="2.5" fill="#136F83"/>
  <circle cx="68" cy="185" r="15" fill="#E0F2F2"/>
  <text x="68" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#136F83">1</text>
  <text x="94" y="192" class="title">Кіріс деректері</text>
  <text x="62" y="234" class="mono">nodes.parquet</text>
  <text x="62" y="265" class="mono">edges.parquet</text>
  <text x="62" y="296" class="mono">transactions.parquet</text>
  <line x1="62" y1="318" x2="260" y2="318" stroke="#E3EAF0"/>
  <text x="62" y="346" class="small">Шикі файлдар өзгермейді</text>

