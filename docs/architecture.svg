  <text x="346" y="265" class="body">Сома / n_tx сәйкестігі</text>
  <text x="346" y="296" font-size="16" fill="#344F63">Қате болса, есеп тоқтайды</text>
  <line x1="346" y1="318" x2="544" y2="318" stroke="#E3EAF0"/>
  <text x="346" y="346" class="small">Қайталанған жолдар сақталады</text>

