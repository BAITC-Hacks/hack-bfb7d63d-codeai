  <text x="630" y="234" font-size="16" fill="#344F63">NetworkX · бағытталған граф</text>
  <text x="630" y="265" font-size="16" fill="#344F63">Ақша, көршілер, seed жолдары</text>
  <text x="630" y="296" font-size="16" fill="#344F63">Орталықтық · уақыттық белгілер</text>
  <line x1="630" y1="318" x2="860" y2="318" stroke="#E3EAF0"/>
  <text x="630" y="346" class="small">Барлық түйін, оқшаулар да бар</text>

  <path d="M890 262H916" class="line"/>
  <rect x="924" y="148" width="316" height="230" rx="16" fill="#FFFFFF" stroke="#D3DFE8"/>
  <rect x="924" y="148" width="316" height="5" rx="2.5" fill="#136F83"/>
  <circle cx="952" cy="185" r="15" fill="#E0F2F2"/>
  <text x="952" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#136F83">4</text>
  <text x="978" y="192" font-size="20" font-weight="650" fill="#142D44">Рөлдер және басымдық</text>
  <text x="946" y="234" class="body">Louvain кластерлері</text>
  <text x="946" y="265" class="body">Ережелер → рөл болжамы</text>
  <text x="946" y="296" class="body">Тәуелсіз тексеру ұпайы</text>
  <line x1="946" y1="318" x2="1218" y2="318" stroke="#E3EAF0"/>
  <text x="946" y="346" class="mono">config/roles.json</text>

  <path d="M650 378V410" class="line"/>
  <path d="M975 378V397H730V410" class="line"/>
  <path d="M1118 378V410" class="line"/>

  <rect x="40" y="420" width="710" height="137" rx="16" fill="#E5F2F4" stroke="#BCDCE1"/>
  <text x="62" y="455" class="title">Streamlit · талдаушының жұмыс орны</text>
  <text x="62" y="487" class="body">vis-network карта · клиент карточкасы · сүзгі · іздеу</text>
  <text x="62" y="532" class="small">Карта сүзгісі жалпы көрсеткіштерді өзгертпейді</text>
  <rect x="541" y="513" width="187" height="28" rx="14" fill="#FFFFFF"/>
  <text x="634" y="532" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#136F83">127.0.0.1:8501</text>

  <rect x="806" y="420" width="434" height="137" rx="16" fill="#E5F2F4" stroke="#BCDCE1"/>
  <text x="828" y="455" class="title">ТЗ нәтижелері · үш CSV</text>
  <text x="828" y="486" font-family="Consolas, monospace" font-size="15" fill="#23475F">nodes_roles.csv · clusters.csv</text>
  <text x="828" y="512" font-family="Consolas, monospace" font-size="15" fill="#23475F">top_nodes.csv + run_report.json</text>
  <text x="828" y="539" class="small">CLI және вебтен жүктеу</text>

  <path d="M94 557V586" class="optional-line"/>
  <text x="109" y="580" font-size="12" fill="#648693">Таңдалған тапсырма мен есептелген фактілер</text>
  <rect x="40" y="596" width="1200" height="182" rx="16" fill="#FFFFFF" stroke="#B9CDD7" stroke-dasharray="6 5"/>
  <text x="62" y="624" class="eyebrow">ҚОСЫМША AI ТҮСІНДІРМЕСІ · ҚАЗІР КІЛТСІЗ</text>
  <rect x="1000" y="609" width="218" height="27" rx="13.5" fill="#F1F5F8"/>
  <text x="1109" y="627" text-anchor="middle" font-size="12" font-weight="600" fill="#527083">Нақты API тексерілмеген</text>

  <rect x="62" y="648" width="336" height="80" rx="11" fill="#F4F7FB"/>
  <text x="79" y="678" font-size="18" font-weight="650" fill="#142D44">Фактілер + C001 белгілері</text>
  <text x="79" y="706" class="small">gid сәйкестігі осы компьютерде</text>
  <path d="M408 689H454" class="optional-line"/>

  <rect x="464" y="648" width="306" height="80" rx="11" fill="#F4F7FB"/>
